name: bash-permission-denied
problem_class: permission_denied
license: MIT
description: |
  Bash or shell command fails with "Permission denied" error.
  Usually occurs when running scripts or accessing files without execute/read permissions.
solution: |
  1. Inspect the exact path, owner, mode, ACLs, and parent traversal permissions before changing anything.
  2. For a trusted script you own that is intended to execute, add only the owner execute bit: chmod u+x -- <script.sh>
  3. Rerun the exact command as the intended non-root user.
  4. For directories, diagnose traversal separately; execute on a directory means traversal, not script execution.
  5. For SSH private keys, verify ownership first and use mode 600 only when that exact file is the denied resource.
  6. Never use chmod 777, blanket sudo, or blind chown as a generic permission fix.
source_url: https://www.gnu.org/software/bash/manual/
tier: SEED
tags:
  - bash
  - shell
  - permission
required_inputs:
  - name: error_message
    type: string
escalation_rules:
  - condition: "'Permission denied' in error_message or 'EACCES' in error_message"
    action: check and fix file permissions with chmod
